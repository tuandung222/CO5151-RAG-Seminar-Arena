name: Sync to Hugging Face Space

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            git push --force https://tuandunghcmut:$HF_TOKEN@huggingface.co/spaces/tuandunghcmut/CO5151-RAG-Seminar-Arena master:main
          else
            echo "::error::HF_TOKEN not set in GitHub Secrets. Cannot sync to HF Space."
            exit 1
          fi
